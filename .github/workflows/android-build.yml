name: Android APK Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository with KuGouMusicApi submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Ensure Android SDK 35 & Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using preinstalled Android SDK at: $SDK_ROOT"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Unit Tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Build web bundle & Sync Capacitor Android
        run: |
          pnpm build
          npx cap sync android

      - name: Decode Permanent Signing Keystore
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "Permanent MELUNE signing keystore ready."
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing on a release tag build! Refusing to publish an ephemeral-key APK."
            exit 1
          else
            echo "No release keystore secret configured; falling back to ephemeral debug keystore."
          fi

      - name: Run Android unit tests & assemble signed APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug
          if [ -f app/release.keystore ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            ./gradlew :app:assembleRelease
            VER="${{ github.ref_name }}"
            cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/MELUNE-${VER}-release.apk"
          fi

      - name: Verify APK Signing Certificate Fingerprint
        working-directory: android
        run: |
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "=== Signed Release APK Cert ==="
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
          fi
          echo "=== Debug APK Cert ==="
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "Signer #1 certificate (DN|SHA-256)"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MELUNE-Release-APK
          path: android/app/build/outputs/apk/release/MELUNE-*-release.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MELUNE-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Generate China-Friendly Update Manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          export TAG="${{ github.ref_name }}"
          export VER="${TAG#v}"
          export APK_NAME="MELUNE-${TAG}-release.apk"
          APK_PATH="android/app/build/outputs/apk/release/${APK_NAME}"
          export APK_SIZE=$(stat -c%s "$APK_PATH")
          export APK_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          export PUB_DATE=$(date -u +%Y-%m-%d)
          mkdir -p dist-updates
          node -e '
            const fs = require("fs");
            const payload = {
              version: process.env.VER,
              tag: process.env.TAG,
              title: `弥音 · MELUNE ${process.env.TAG}`,
              publishedAt: process.env.PUB_DATE,
              releaseNotes: `弥音 · MELUNE ${process.env.TAG} 正式发布（支持大陆多路加速下载与 SHA-256 完整性校验），建议立即更新体验最新优化。`,
              htmlUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/${process.env.TAG}`,
              apkFileName: process.env.APK_NAME,
              apkSizeBytes: Number(process.env.APK_SIZE),
              apkSha256: process.env.APK_SHA,
              githubDownloadUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG}/${process.env.APK_NAME}`
            };
            fs.writeFileSync("dist-updates/latest.json", JSON.stringify(payload, null, 2) + "\n");
          '
          echo "=== Generated latest.json ==="
          cat dist-updates/latest.json

      - name: Create GitHub Release on Tag (Permanent Signed Release APK + latest.json)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/MELUNE-*-release.apk
            dist-updates/latest.json

      - name: Publish updates branch & Purge jsDelivr CDN
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.ref_name }}"
          TMP_DIR=$(mktemp -d)
          cp dist-updates/latest.json "$TMP_DIR/latest.json"
          cd "$TMP_DIR"
          git init -b updates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "chore(updates): publish manifest for ${TAG}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin updates:updates
          curl -fsSL "https://purge.jsdelivr.net/gh/${{ github.repository }}@updates/latest.json" || true
