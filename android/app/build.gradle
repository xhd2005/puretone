apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def localKeystoreProps = new Properties()
def localKeystorePropsFile = rootProject.file('keystore.properties')
if (localKeystorePropsFile.exists()) {
    localKeystorePropsFile.withInputStream { localKeystoreProps.load(it) }
}

def ciKeystoreFile = file('release.keystore')
def hasCiSigning = ciKeystoreFile.exists() && System.getenv('ANDROID_KEYSTORE_PASSWORD')
def localKsPath = localKeystoreProps.getProperty('storeFile', '')
def hasLocalSigning = localKsPath && file(localKsPath).exists() && localKeystoreProps.getProperty('storePassword', '')
def hasPermanentSigning = hasCiSigning || hasLocalSigning

android {
    namespace "com.xhd2005.puretone"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.xhd2005.puretone"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "2.2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    signingConfigs {
        release {
            if (hasCiSigning) {
                storeFile ciKeystoreFile
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'puretone'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            } else if (hasLocalSigning) {
                storeFile file(localKsPath)
                storePassword localKeystoreProps.getProperty('storePassword')
                keyAlias localKeystoreProps.getProperty('keyAlias', 'puretone')
                keyPassword localKeystoreProps.getProperty('keyPassword', localKeystoreProps.getProperty('storePassword'))
            }
        }
    }

    buildTypes {
        debug {
            // Use the same permanent PureTone signing certificate locally & on CI when present,
            // so debug/release/CI updates ALWAYS overwrite-install cleanly with zero data loss.
            if (hasPermanentSigning) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasPermanentSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    // Native Media3 (ExoPlayer + MediaSession foreground playback + 300MB LRU disk cache)
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.5.1'
    implementation 'androidx.media3:media3-database:1.5.1'
    implementation 'androidx.concurrent:concurrent-futures:1.2.0'
    implementation 'com.google.guava:guava:33.3.1-android'

    // Native Zero-CORS HTTP client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'
